<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Корзина и заказ — TAU Lounge</title><link rel="icon" href="./assets/tau-logo.jpg"><link rel="stylesheet" href="./style.css"></head>
<body><header class="top"><div class="wrap nav"><a class="brand" href="./index.html"><img src="./assets/tau-logo.jpg" alt="TAU"><span>TAU<small>LOUNGE RESTAURANT</small></span></a><nav class="links"><a href="./index.html#menu" data-i="menu">Меню</a><a href="./index.html#about" data-i="about">О ресторане</a><a href="./index.html#contacts" data-i="contacts">Контакты</a></nav><div><button class="lang" id="lang">ҚАЗ</button> <a class="cartbtn" href="./order.html"><span data-i="cart">Корзина</span> <b id="count">0</b></a></div></div></header>
<main class="wrap section"><div class="kicker">TAU — YOUR ORDER</div><h2 data-i="title">Корзина и оформление заказа<em>.</em></h2><div id="cart"></div><div class="total" id="total"></div><form class="form" id="form"><label><span data-i="name">Имя и фамилия</span><input name="name" required></label><label><span data-i="phone">Номер телефона</span><input name="phone" type="tel" required placeholder="+7 ___ ___ __ __"></label><label><span data-i="address">Адрес доставки</span><input name="address" required></label><label><span data-i="comment">Комментарий</span><textarea name="comment" rows="3"></textarea></label><p class="notice" data-i="note">Сервисный сбор 10%. Условия доставки уточняются у ресторана.</p><button class="btn" type="submit" data-i="send">Продолжить в WhatsApp →</button></form></main><footer class="foot"><div class="wrap">© TAU Lounge Restaurant · Павлодар</div></footer>
<script type="module">
import {menu} from './menu.js';
const tr={ru:{menu:'Меню',about:'О ресторане',contacts:'Контакты',cart:'Корзина',title:'Корзина и оформление заказа.',name:'Имя и фамилия',phone:'Номер телефона',address:'Адрес доставки',comment:'Комментарий',note:'Сервисный сбор 10%. Условия доставки уточняются у ресторана.',send:'Продолжить в WhatsApp →',empty:'Корзина пуста. Вернитесь в меню.',total:'Итого',remove:'Удалить',fee:'Сервисный сбор 10%'},kz:{menu:'Мәзір',about:'Мейрамхана',contacts:'Байланыс',cart:'Себет',title:'Себет және тапсырысты рәсімдеу.',name:'Аты-жөні',phone:'Телефон нөмірі',address:'Жеткізу мекенжайы',comment:'Түсініктеме',note:'Қызмет көрсету ақысы 10%. Жеткізу шарттарын мейрамханадан нақтылаңыз.',send:'WhatsApp арқылы жалғастыру →',empty:'Себет бос. Мәзірге оралыңыз.',total:'Барлығы',remove:'Жою',fee:'Қызмет көрсету ақысы 10%'}};
let lang=localStorage.getItem('tau-lang')||'ru';const money=n=>n.toLocaleString('ru-RU')+' ₸';const getCart=()=>JSON.parse(localStorage.getItem('tau-cart')||'{}');const setCart=c=>localStorage.setItem('tau-cart',JSON.stringify(c));
function render(){const t=tr[lang],c=getCart(),items=menu.filter(p=>c[p.id]&&p.price),sum=items.reduce((s,p)=>s+p.price*c[p.id],0);document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>{if(t[e.dataset.i])e.textContent=t[e.dataset.i]});document.getElementById('lang').textContent=lang==='ru'?'ҚАЗ':'РУС';document.getElementById('count').textContent=Object.values(c).reduce((a,b)=>a+b,0);document.getElementById('cart').innerHTML=items.length?items.map(p=>`<div class="cartrow"><div><b>${p.name.ru}</b><div class="muted">${money(p.price)}</div></div><div class="qty"><button data-dec="${p.id}">−</button><strong>${c[p.id]}</strong><button data-inc="${p.id}">+</button></div><div class="lineprice">${money(p.price*c[p.id])} <button class="chip" data-del="${p.id}">${t.remove}</button></div></div>`).join(''):`<p class="muted">${t.empty} <a href="./index.html#menu">→</a></p>`;document.getElementById('total').textContent=t.total+': '+money(sum);document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{c[b.dataset.inc]++;setCart(c);render()});document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{c[b.dataset.dec]--;if(c[b.dataset.dec]<=0)delete c[b.dataset.dec];setCart(c);render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{delete c[b.dataset.del];setCart(c);render()});}
document.getElementById('lang').onclick=()=>{lang=lang==='ru'?'kz':'ru';localStorage.setItem('tau-lang',lang);render()};document.getElementById('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),c=getCart(),items=menu.filter(p=>c[p.id]&&p.price);if(!items.length){alert(tr[lang].empty);return}const sum=items.reduce((s,p)=>s+p.price*c[p.id],0);const lines=items.map(p=>`${p.name.ru} × ${c[p.id]} — ${money(p.price*c[p.id])}`).join('\\n');const msg=`TAU Lounge Restaurant\\n${tr[lang].name}: ${f.get('name')}\\n${tr[lang].phone}: ${f.get('phone')}\\n${tr[lang].address}: ${f.get('address')}\\n${tr[lang].comment}: ${f.get('comment')||'—'}\\n\\n${lines}\\n\\n${tr[lang].total}: ${money(sum)}\\n${tr[lang].fee}`;window.location.href='https://wa.me/77004242607?text='+encodeURIComponent(msg)};render();
</script></body></html>
